<script>
var DATA = {};
var NOW = Date.now();
var DAY = 86400000;

// Ex-membros: some do painel (não contam, não aparecem em filtros/WIP)
var EXCLUDE = ["dhemerson","hugo","tiago"];
(function(){var tk=DATA.tasks||{};for(var id in tk){var t=tk[id];if(t&&t.assignees&&t.assignees.length){t.assignees=t.assignees.filter(function(a){return EXCLUDE.indexOf(String(a).trim().split(/\s+/)[0].toLowerCase())<0;});}}})();

var SC = {"a fazer":"var(--s-afazer)","em produção":"var(--s-producao)","revisão interna":"var(--s-revisao)","ajustes/refação":"var(--s-ajustes)","em aprovação":"var(--s-aprovacao)","enviado para o cliente":"var(--s-enviado)","impedimento":"var(--s-impedimento)","contrato":"var(--s-afazer)","assinatura":"var(--s-aprovacao)","abertura de vaga":"var(--s-afazer)"};
function scol(s){return SC[s]||"var(--s-outro)";}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function fmtDur(ms){ms=ms||0;var m=Math.round(ms/60000);if(m<60)return m+"m";var h=Math.floor(m/60);var r=m%60;return h+"h"+(r?" "+r+"m":"");}
function initials(n){n=n||"?";var p=n.trim().split(/\s+/);return((p[0]||"")[0]||"")+((p[1]||"")[0]||"");}
function first(n){return (n||"").split(" ")[0];}

// ---- prazo / envelhecimento ----
function dueInfo(t){if(!t.dueMs)return null;var d=Math.floor((t.dueMs-NOW)/DAY);if(t.dueMs<NOW)return {k:"due",lbl:"🔴 atrasada"};if(d<=1)return {k:"duesoon",lbl:"⏰ "+(d<=0?"hoje":"amanhã")};return null;}
function agingLevel(status,d){d=d||0;
 if(status==="impedimento")return d>=4?"crit":(d>=2?"warn":"");
 if(status==="em aprovação"||status==="assinatura")return d>=6?"crit":(d>=3?"warn":"");

 var byLine=(t.timeBy&&t.timeBy.length)?'<div class="tby">'+t.timeBy.map(function(x){return esc(x.user)+": "+fmtDur(x.ms);}).join(" · ")+'</div>':'';
 var cmt=(t.lastComment&&t.lastComment.text)?'<div class="msec">💬 Último comentário</div><div class="mcomment">"'+esc(t.lastComment.text)+'"<span class="cmby">— '+esc(t.lastComment.by||"?")+(t.lastComment.brt?" · "+esc(t.lastComment.brt):"")+'</span></div>':'';
 var hist=(t.history&&t.history.length)?t.history.map(function(h){return '<div class="hstep"><span class="hd">'+esc(h.brt||"")+'</span><span class="pill" style="background:'+scol(h.s)+'">'+esc(h.s)+'</span></div>';}).join(""):'<div class="note">Sem histórico de status registrado.</div>';
 var m='<button class="mclose" onclick="closeTask()">×</button><div class="mhead"><h3>'+esc(t.name)+'</h3><div class="msub"><span class="pill" style="background:'+scol(t.status)+'">'+esc(t.status)+'</span> '+dueTag(t)+' '+(t.client&&t.client!=="—"?"🏢 "+esc(t.client)+" · ":"")+esc(t.area)+' · '+esc(who)+'</div></div>'+
  '<div class="mbody">'+stats+byLine+cmt+
  '<div class="msec">🔄 Alterações que a demanda passou</div>'+hist+
  ((t.url&&t.url!=="#")?'<a class="mlink" href="'+esc(t.url)+'" target="_blank" rel="noopener noreferrer">Abrir no ClickUp ↗</a>':'<div class="note" style="margin-top:14px">Sem link do ClickUp.</div>')+'</div>';
 document.getElementById("modal").innerHTML=m;document.getElementById("ovl").classList.add("on");}
function closeTask(){document.getElementById("ovl").classList.remove("on");}
document.getElementById("ovl").addEventListener("click",function(e){if(e.target===this)closeTask();});

Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.addEventListener("click",function(){
 Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(x){x.classList.remove("on");});
 Array.prototype.forEach.call(document.querySelectorAll(".view"),function(x){x.classList.remove("on");});
 b.classList.add("on");document.getElementById("v-"+b.dataset.v).classList.add("on");});});

var TRIGGER={owner:"carlosedualcosta-source",repo:"surreal-daily",token:""};
function applyExclude(){var tk=DATA.tasks||{};for(var id in tk){var t=tk[id];if(t&&t.assignees&&t.assignees.length){t.assignees=t.assignees.filter(function(a){return EXCLUDE.indexOf(String(a).trim().split(/\s+/)[0].toLowerCase())<0;});}}}
function setStatus(s){var e=document.getElementById("rstatus");if(e)e.textContent=s;}
function setBtn(on){var b=document.getElementById("btnRefresh");if(b){b.disabled=!on;b.style.opacity=on?"1":".6";b.style.cursor=on?"pointer":"default";}}
function renderAll(){applyExclude();NOW=Date.now();var g=DATA.generatedAt||{};
 document.getElementById("eyebrow").textContent="Surreal Group · Daily · "+(g.slot||"");
 document.getElementById("ativas").textContent=(DATA.totals&&DATA.totals.ativas)||0;
 document.getElementById("sub").textContent=(g.brt||"")+" · comparado com a foto anterior: "+(DATA.prev&&DATA.prev.brt?DATA.prev.brt:"— (linha de base)");
 document.getElementById("foot").innerHTML="tarefas-mãe (sem subtarefas) · Operacional + CRM + Agência · números direto da API do ClickUp · atualiza sozinho + botão Atualizar";
 renderGeral();renderBoard();renderGargalos();renderHist();}
function showEmpty(){document.getElementById("v-geral").innerHTML='<div class="card"><p class="note">Nenhum dado ainda. Rodando a primeira coleta… recarregue em ~2 min.</p></div>';}
function applyData(d){DATA=d||{};if(DATA.totals){renderAll();setStatus("Atualizado "+((DATA.generatedAt&&DATA.generatedAt.brt)||""));}else{showEmpty();setStatus("sem dados ainda");}}
function loadData(cb){fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():{};}).then(function(d){applyData(d);if(cb)cb(d);}).catch(function(){setStatus("erro ao carregar");});}
var polls=0;
function pollGh(prevIso){fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():{};}).then(function(d){if(d&&d.generatedAt&&d.generatedAt.iso!==prevIso&&d.totals){applyData(d);setBtn(true);setStatus("Atualizado agora · "+((d.generatedAt&&d.generatedAt.brt)||""));}else{polls++;if(polls>60){setBtn(true);setStatus("demorou — recarregue em instantes");return;}setStatus("Atualizando… ("+(polls*5)+"s)");setTimeout(function(){pollGh(prevIso);},5000);}}).catch(function(){polls++;if(polls>60){setBtn(true);setStatus("erro");return;}setTimeout(function(){pollGh(prevIso);},5000);});}
function doRefresh(){
 if(!TRIGGER.token){setStatus("Recarregando…");loadData(function(){setStatus("Recarregado "+((DATA.generatedAt&&DATA.generatedAt.brt)||""));});return;}
 setBtn(false);polls=0;var prevIso=(DATA.generatedAt&&DATA.generatedAt.iso)||"";setStatus("Atualizando… (rodando no GitHub, ~1-2 min)");
 fetch("https://api.github.com/repos/"+TRIGGER.owner+"/"+TRIGGER.repo+"/actions/workflows/refresh.yml/dispatches",{method:"POST",headers:{"Authorization":"token "+TRIGGER.token,"Accept":"application/vnd.github+json"},body:JSON.stringify({ref:"main"})}).then(function(r){if(r.status>=200&&r.status<300){setTimeout(function(){pollGh(prevIso);},8000);}else{setBtn(true);setStatus("erro ao disparar ("+r.status+")");}}).catch(function(){setBtn(true);setStatus("erro ao disparar");});
}
loadData();
</script>
