var EXCLUDE = ["dhemerson","hugo","tiago"];
(function(){var tk=DATA.tasks||{};for(var id in tk){var t=tk[id];if(t&&t.assignees&&t.assignees.length){t.assignees=t.assignees.filter(function(a){return EXCLUDE.indexOf(String(a).trim().split(/\s+/)[0].toLowerCase())<0;});}}})();

var SC = {"a fazer":"var(--s-afazer)","em produção":"var(--s-producao)","revisão interna":"var(--s-revisao)","ajustes/refação":"var(--s-ajustes)","em aprovação":"var(--s-aprovacao)","enviado para o cliente":"var(--s-enviado)","impedimento":"var(--s-impedimento)","contrato":"var(--s-afazer)","assinatura":"var(--s-aprovacao)","abertura de vaga":"var(--s-afazer)"};
function scol(s){return SC[s]||"var(--s-outro)";}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function fmtDur(ms){ms=ms||0;var m=Math.round(ms/60000);if(m<60)return m+"m";var h=Math.floor(m/60);var r=m%60;return h+"h"+(r?" "+r+"m":"");}
function initials(n){n=n||"?";var p=n.trim().split(/\s+/);return((p[0]||"")[0]||"")+((p[1]||"")[0]||"");}
function first(n){return (n||"").split(" ")[0];}

// ---- prazo / envelhecimento ----
function dueInfo(t){if(!t.dueMs)return null;var d=Math.floor((t.dueMs-NOW)/DAY);if(t.dueMs<NOW)return {k:"due",lbl:"🔴 atrasada"};if(d<=1)return {k:"duesoon",lbl:"⏰ "+(d<=0?"hoje":"amanhã")};return null;}
function agingLevel(status,d){d=d||0;
 if(status==="impedimento")return d>=4?"crit":(d>=2?"warn":"");
 if(status==="em aprovação"||status==="assinatura")return d>=6?"crit":(d>=3?"warn":"");
 if(status==="enviado para o cliente")return d>=7?"crit":(d>=4?"warn":"");
 return d>=10?"crit":(d>=5?"warn":"");}
function ageTag(t){var lv=agingLevel(t.status,t.daysIn);if(!lv)return "";return '<span class="tag age-'+lv+'">🕒 '+t.daysIn+'d parada</span>';}
function dueTag(t){var di=dueInfo(t);return di?'<span class="tag '+di.k+'">'+di.lbl+'</span>':"";}
function allTasks(){return DATA.tasks||{};}
function activeList(){var o=[];var tk=allTasks();for(var id in tk){var t=tk[id];if(t&&t.status!=="concluída")o.push(Object.assign({id:id},t));}return o;}

function taskItem(id,extra){var t=DATA.tasks[id];if(!t)return "";var who=(t.assignees&&t.assignees.length)?t.assignees.join(", "):"sem responsável";
 return '<li class="ti" onclick="openTask(\''+id+'\')"><span class="pill" style="background:'+scol(t.status)+'">'+esc(t.status)+'</span>'+
   '<span class="nm">'+esc(t.name)+'</span> '+dueTag(t)+' '+ageTag(t)+'<span class="meta">'+(t.client&&t.client!=="—"?"🏢 "+esc(t.client)+" · ":"")+esc(t.area)+' · '+esc(who)+(extra?' · '+extra:'')+'</span></li>';}

function section(icon,title,color,ids,decorate){if(!ids||!ids.length)return "";var items=ids.map(function(x){var id=x.id||x;var ex=decorate?decorate(x):"";return taskItem(id,ex);}).join("");
 return '<div class="card"><div class="ch"><span class="ic" style="background:'+color+'22;color:'+color+'">'+icon+'</span><h2>'+title+'</h2><span class="c" style="color:'+color+'">'+ids.length+'</span></div><ul class="lst">'+items+'</ul></div>';}

// ---- computados a partir das tasks ----
function overdueLists(){var atr=[],ven=[];activeList().forEach(function(t){var di=dueInfo(t);if(di&&di.k==="due")atr.push(t);else if(di&&di.k==="duesoon")ven.push(t);});
 atr.sort(function(a,b){return a.dueMs-b.dueMs;});ven.sort(function(a,b){return a.dueMs-b.dueMs;});return {atr:atr,ven:ven};}
function stuckCount(){return activeList().filter(function(t){return agingLevel(t.status,t.daysIn)==="crit";}).length;}

function buildSummary(){var d=DATA,f=d.totals||{},k=d.day||{},lines=[];
 lines.push({i:"📌",h:'<b>Hoje:</b> '+(k.concluidas||0)+' entregas ✅ · '+(k.novas||0)+' novas 🆕 · '+(k.prodAprov||0)+' p/ aprovação ➡️ · '+(k.novosImped||0)+' novos impedimentos ⛔'});
 var ov=overdueLists();if(ov.atr.length||ov.ven.length){var parts=[];if(ov.atr.length)parts.push('🔴 <b>'+ov.atr.length+'</b> atrasada'+(ov.atr.length>1?'s':''));if(ov.ven.length)parts.push('⏰ <b>'+ov.ven.length+'</b> vencem em 48h');lines.push({i:"⚠️",h:parts.join(' · ')+' — ver Gargalos'});}
 var sc=stuckCount();if(sc)lines.push({i:"🕒",h:'<b>'+sc+'</b> demanda'+(sc>1?'s':'')+' travada'+(sc>1?'s':'')+' há muito tempo precisam de decisão'});
 var ba=(d.byArea||[])[0];var wl=wipRank()[0];
 if(ba||wl){var t2=[];if(ba)t2.push('maior carga em <b>'+esc(ba.area)+'</b> ('+ba.n+')');if(wl)t2.push('<b>'+esc(first(wl.name))+'</b> com '+wl.total+' ativas');lines.push({i:"📊",h:'Carga: '+t2.join(' · ')});}
 return '<div class="summary">'+lines.map(function(l){return '<div class="sl"><span class="si">'+l.i+'</span><span>'+l.h+'</span></div>';}).join("")+'</div>';}

function renderTrend(){var runs=(DATA.runs||[]).slice(-14);if(!runs.length)return "";
 var mx=1;runs.forEach(function(r){mx=Math.max(mx,r.concluidas||0,r.novas||0);});
 var cols=runs.map(function(r){var gh=Math.round((r.concluidas||0)/mx*76),nh=Math.round((r.novas||0)/mx*76);
  var lbl=(r.brt||"").split(" ")[0]||"";lbl=lbl.split("/").slice(0,2).join("/");
  return '<div class="tcol"><div class="tbars"><div class="tb g" style="height:'+Math.max(gh,2)+'px" title="'+(r.concluidas||0)+' concluídas"></div><div class="tb n" style="height:'+Math.max(nh,2)+'px" title="'+(r.novas||0)+' novas"></div></div><div class="tl">'+esc(lbl)+'</div></div>';}).join("");
 return '<div class="card"><div class="ch"><span class="ic" style="background:var(--accentbg);color:var(--accent)">📈</span><h2>Tendência — entregas vs. novas</h2></div><div class="trend">'+cols+'</div><div class="legend"><span><i style="background:var(--good)"></i>Concluídas</span><span><i style="background:var(--new)"></i>Novas</span></div></div>';}

function renderGeral(){var d=DATA,f=d.totals,pct=d.faixaPct||{};
 var summary=buildSummary();
 var faixas='<div class="faixas">'+
  '<div class="faixa f-aberto"><div class="n mono">'+f.aberto+'</div><div class="l">🔵 Em aberto</div><div class="p">'+(pct.aberto||0)+'%</div></div>'+
  '<div class="faixa f-aprov"><div class="n mono">'+f.aprovacao+'</div><div class="l">🟡 Aguardando aprovação</div><div class="p">'+(pct.aprovacao||0)+'%</div></div>'+
  '<div class="faixa f-cliente"><div class="n mono">'+f.cliente+'</div><div class="l">🟢 Com cliente</div><div class="p">'+(pct.cliente||0)+'%</div></div>'+
  '<div class="faixa f-bloq"><div class="n mono">'+f.bloqueado+'</div><div class="l">🔴 Impedimento</div><div class="p">'+(pct.bloqueado||0)+'%</div></div></div>';
 var k=d.day||{};
 var kp=[];
 if(k.novas)kp.push('<div class="kpi"><div class="n" style="color:var(--new)">'+k.novas+'</div><div class="l">🆕 Novas</div></div>');

 if(k.novosImped)kp.push('<div class="kpi"><div class="n" style="color:var(--crit)">'+k.novosImped+'</div><div class="l">⛔ Novos imped.</div></div>');
 var kpis=kp.length?'<div class="kpis" style="margin-bottom:18px">'+kp.join("")+'</div>':'';
 var ov=overdueLists();var sc=stuckCount();
 function alertCard(n,ic,col,title){if(!n)return "";
  return '<button class="alertbtn" style="border-left-color:'+col+'" onclick="gotoTab(\'gargalos\')"><span class="ic" style="background:'+col+'22;color:'+col+'">'+ic+'</span><span class="n mono" style="color:'+col+'">'+n+'</span><span class="l">'+title+'</span><span class="algo">ver ›</span></button>';}
 var av=alertCard(ov.atr.length,"🔴","var(--crit)","atrasadas")+alertCard(ov.ven.length,"⏰","var(--warn)","vencem em 48h")+alertCard(sc,"🕒","var(--move)","travadas há tempo");
 var alerts=av?'<div class="alertrow">'+av+'</div>':'';
 var s=d.sections||{};
 var secs=section("✅","Concluídas desde a última foto","var(--good)",s.concluidas)+
  section("➡️","Passaram de Produção → Aprovação","var(--warn)",s.prodAprov)+
  section("🔄","Outras mudanças de status","var(--move)",s.mudancas,function(x){return '<b>'+esc(x.from)+' → '+esc(x.to)+'</b>';})+
  section("🆕","Novas tarefas","var(--new)",s.novas)+
  section("⛔","Novos impedimentos","var(--crit)",s.novosImped);
 var amax=1;(d.byArea||[]).forEach(function(a){if(a.n>amax)amax=a.n;});
 var bars=(d.byArea||[]).map(function(a){return '<div class="bar"><div class="nm">'+esc(a.area)+'</div><div class="tk"><span style="width:'+Math.round(a.n/amax*100)+'%"></span></div><div class="c">'+a.n+'</div></div>';}).join("");
 var carga='<div class="card"><div class="ch"><span class="ic" style="background:#8890a622;color:var(--ink2)">⏳</span><h2>Faltam concluir — carga por área</h2><span class="c">'+f.ativas+'</span></div><div class="bars">'+bars+'</div></div>';
 var detalhes=(secs||carga||renderTrend())?'<details class="more"><summary>Ver detalhes do dia (movimentações, carga e tendência)</summary>'+kpis+secs+carga+renderTrend()+'</details>':'';
 document.getElementById("v-geral").innerHTML=summary+alerts+faixas+detalhes;}

// ---- Kanban ----
var BF=null,PEOPLE=[],KC={},EFF={};
function setBF(i){BF=(i<0)?null:PEOPLE[i];renderBoard();}
function toggleCol(i){var c=(DATA.board||[])[i];if(!c)return;KC[c.status]=!EFF[c.status];renderBoard();}
function expandAllCols(){(DATA.board||[]).forEach(function(c){KC[c.status]=false;});renderBoard();}
function resetCols(){KC={};renderBoard();}
function renderBoard(){var cols=DATA.board||[];
 var pc={};cols.forEach(function(col){(col.ids||[]).forEach(function(id){var t=DATA.tasks[id];((t&&t.assignees)||[]).forEach(function(a){pc[a]=(pc[a]||0)+1;});});});
 PEOPLE=Object.keys(pc).sort(function(a,b){return pc[b]-pc[a];});
 var fb='<div class="kfilter"><span class="flabel">Responsável:</span><button class="fchip'+(BF==null?" on":"")+'" onclick="setBF(-1)">Todos</button>'+
   PEOPLE.map(function(n,i){return '<button class="fchip'+(BF===n?" on":"")+'" onclick="setBF('+i+')"><span class="fav">'+esc(initials(n).toUpperCase())+'</span>'+esc(first(n))+' <span class="fct">'+pc[n]+'</span></button>';}).join("")+'</div>';
 var tools='<div class="ktools"><span class="flabel">Colunas:</span><button class="fchip" onclick="expandAllCols()">Expandir todas</button><button class="fchip" onclick="resetCols()">Recolher vazias</button></div>';
 var html='<div class="board">'+cols.map(function(col,idx){var cc=scol(col.status);
   var ids=(col.ids||[]).filter(function(id){var t=DATA.tasks[id];return t&&(BF==null||((t.assignees||[]).indexOf(BF)>-1));});
   var collapsed=(col.status in KC)?KC[col.status]:(ids.length===0);EFF[col.status]=collapsed;
   if(collapsed){
     return '<div class="kcol collapsed" style="border-top-color:'+cc+'" onclick="toggleCol('+idx+')" title="'+esc(col.status)+' — '+ids.length+' (clique para abrir)"><div class="kcoll"><span class="kchev">▸</span><span class="kdot" style="background:'+cc+'"></span><span class="kclabel">'+esc(col.status)+'</span><span class="kccount">'+ids.length+'</span></div></div>';
   }
   var cards=ids.map(function(id){var t=DATA.tasks[id];var who=(t.assignees&&t.assignees.length)?t.assignees.join(", "):"sem responsável";var av=(t.assignees&&t.assignees.length)?esc(initials(t.assignees[0]).toUpperCase()):"–";
     var tags=dueTag(t)+ageTag(t);
     return '<div class="kcard" style="border-left-color:'+cc+';background:color-mix(in srgb,'+cc+' 6%,var(--panel))" onclick="openTask(\''+id+'\')">'+(t.client&&t.client!=="—"?'<div class="kclient">'+esc(t.client)+'</div>':'')+'<div class="kname">'+esc(t.name)+'</div>'+(tags?'<div class="ktags">'+tags+'</div>':'')+'<div class="kfoot"><span class="kav" style="background:'+cc+'">'+av+'</span><span class="kmeta">'+esc(who)+' · '+esc(t.area)+'</span></div></div>';}).join("");
   return '<div class="kcol" style="border-top-color:'+cc+'"><div class="khead" style="background:color-mix(in srgb,'+cc+' 14%,transparent)" onclick="toggleCol('+idx+')" title="clique para recolher"><span class="kchev">▾</span><span class="kdot" style="background:'+cc+'"></span>'+esc(col.status)+'<span class="kcount">'+ids.length+'</span></div><div class="kbody">'+(cards||'<div class="kempty">—</div>')+'</div></div>';
 }).join("")+'</div>';
 document.getElementById("v-board").innerHTML=fb+tools+html;}

// ---- Ação & Gargalos ----
function wipRank(){var m={};activeList().forEach(function(t){(t.assignees&&t.assignees.length?t.assignees:["Sem responsável"]).forEach(function(a){if(!m[a])m[a]={name:a,total:0,prod:0};m[a].total++;if(t.status==="em produção")m[a].prod++;});});
 return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return b.total-a.total;});}

function brow(t,tail){var who=(t.assignees&&t.assignees.length)?t.assignees.join(", "):"sem responsável";
 var cm=t.lastComment&&t.lastComment.text?'<div class="cm">"'+esc(t.lastComment.text)+'"<span class="cmby">— '+esc(t.lastComment.by||"?")+(t.lastComment.brt?" · "+esc(t.lastComment.brt):"")+'</span></div>':"";
 return '<div class="brow" onclick="openTask(\''+t.id+'\')"><div class="bt">'+esc(t.name)+' '+dueTag(t)+'</div><div class="bm">'+(t.client&&t.client!=="—"?"🏢 "+esc(t.client)+" · ":"")+esc(t.area)+' · '+esc(who)+' · '+tail+'</div>'+cm+'</div>';}

var GF={who:"",client:"",area:""},WIPN=[],CLN=[];
function setGF(k,v){GF[k]=v;renderGargalos();}
function setGFwho(i){GF.who=(GF.who===WIPN[i])?"":WIPN[i];renderGargalos();}
function setGFcli(i){GF.client=(GF.client===CLN[i])?"":CLN[i];renderGargalos();}
function clearGF(){GF={who:"",client:"",area:""};renderGargalos();}
function matchGF(t){var who=(t.assignees&&t.assignees.length)?t.assignees:["Sem responsável"];return (!GF.who||who.indexOf(GF.who)>-1)&&(!GF.client||t.client===GF.client)&&(!GF.area||t.area===GF.area);}
function uniqSort(a){return a.filter(function(v,i){return v&&a.indexOf(v)===i;}).sort(function(x,y){return String(x).localeCompare(String(y));});}
function gsel(k,label,opts){return '<select class="gsel" onchange="setGF(\''+k+'\',this.value)"><option value="">'+label+': todos</option>'+opts.map(function(v){return '<option value="'+esc(v)+'"'+(v===GF[k]?' selected':'')+'>'+esc(v)+'</option>';}).join("")+'</select>';}
function byDaysDesc(a,b){return (b.daysIn||0)-(a.daysIn||0);}

function renderGargalos(){var act=activeList();
 var people=uniqSort([].concat.apply([],act.map(function(t){return t.assignees&&t.assignees.length?t.assignees:["Sem responsável"];})));
 var clients=uniqSort(act.map(function(t){return (t.client&&t.client!=="—")?t.client:null;}));
 var areas=uniqSort(act.map(function(t){return t.area;}));
 var active=(GF.who||GF.client||GF.area);
 var bar='<div class="gfbar"><span class="flabel">Filtrar:</span>'+gsel("who","Responsável",people)+gsel("client","Cliente",clients)+gsel("area","Área",areas)+(active?'<button class="fchip" onclick="clearGF()">✕ limpar</button>':'')+'</div>';
 var allImp=act.filter(function(t){return t.status==="impedimento";});
 var allAtr=act.filter(function(t){var d=dueInfo(t);return d&&d.k==="due";});
 var atr=allAtr.filter(matchGF).sort(function(a,b){return a.dueMs-b.dueMs;});
 var imp=allImp.filter(matchGF).sort(byDaysDesc);
 var wait=act.filter(function(t){return t.status==="em aprovação"||t.status==="assinatura"||t.status==="enviado para o cliente";}).filter(matchGF).sort(byDaysDesc);
 var impCard='<div class="card alert"><div class="ch"><span class="ic" style="background:var(--crit)22;color:var(--crit)">⛔</span><h2>Impedimentos — o que está travado</h2><span class="c" style="color:var(--crit)">'+imp.length+'</span></div>'+
  (imp.length?imp.map(function(t){return brow(t,'travada há <b>'+(t.daysIn||0)+'d</b>');}).join(""):'<p class="empty">'+(active?'Nenhum impedimento com esse filtro.':'Nenhum impedimento 🎉')+'</p>')+'</div>';
 var waitCard='<div class="card alert soft"><div class="ch"><span class="ic" style="background:var(--warn)22;color:var(--warn)">⌛</span><h2>Parados aguardando aprovação / cliente</h2><span class="c" style="color:var(--warn)">'+wait.length+'</span></div>'+
  (wait.length?wait.map(function(t){return brow(t,'aguardando há <b>'+(t.daysIn||0)+'d</b> ('+esc(t.status)+')');}).join(""):'<p class="empty">'+(active?'Nada parado com esse filtro.':'Nada parado.')+'</p>')+'</div>';
 var wr=wipRank();var wmax=1;wr.forEach(function(w){wmax=Math.max(wmax,w.total);});WIPN=wr.map(function(w){return w.name;});
 var wipCard='<div class="card"><div class="ch"><span class="ic" style="background:var(--accentbg);color:var(--accent)">👥</span><h2>Carga por pessoa (WIP)</h2><span class="c">'+wr.length+'</span></div>'+
  wr.map(function(w,i){var over=w.total>=12;var col=over?"var(--crit)":"var(--accent)";var sel=(GF.who===w.name);
   return '<div class="wrow pick'+(sel?' selp':'')+'" onclick="setGFwho('+i+')"><div class="wn"><span class="wav" style="background:'+col+'">'+esc(initials(w.name).toUpperCase())+'</span>'+esc(first(w.name))+'</div><div class="wtk"><span style="width:'+Math.round(w.total/wmax*100)+'%;background:'+col+'"></span></div><div class="wc"><b class="'+(over?'wover':'')+'">'+w.total+'</b> <span class="wp">'+w.prod+'▶</span></div></div>';}).join("")+
  '<p class="note">Clique numa pessoa pra filtrar as listas acima · barra = ativas · ▶ = em produção · vermelho = ≥12.</p></div>';
 var cm={};act.forEach(function(t){var c=(t.client&&t.client!=="—")?t.client:null;if(!c)return;if(!cm[c])cm[c]={name:c,total:0,imp:0,ap:0};cm[c].total++;if(t.status==="impedimento")cm[c].imp++;if(t.status==="em aprovação"||t.status==="assinatura"||t.status==="enviado para o cliente")cm[c].ap++;});
 var cl=Object.keys(cm).map(function(k){return cm[k];}).sort(function(a,b){return b.total-a.total;}).slice(0,14);CLN=cl.map(function(c){return c.name;});
 var cliCard='<div class="card"><div class="ch"><span class="ic" style="background:var(--s-enviado)22;color:var(--s-enviado)">🏢</span><h2>Por cliente</h2><span class="c">'+cl.length+'</span></div>'+
  (cl.length?'<div class="clg">'+cl.map(function(c,i){var fl="";if(c.imp)fl+='<span class="cflag" style="background:var(--s-impedimento)">⛔ '+c.imp+'</span>';if(c.ap)fl+='<span class="cflag" style="background:var(--s-aprovacao)">⌛ '+c.ap+'</span>';var sel=(GF.client===c.name);
   return '<div class="crow pick'+(sel?' selp':'')+'" onclick="setGFcli('+i+')"><span class="cc">'+c.total+'</span><span class="cn">'+esc(c.name)+'</span><span class="cflags">'+fl+'</span></div>';}).join("")+'</div>':'<p class="empty">Sem cliente marcado nas demandas ativas.</p>')+'</div>';
 var atrCard='<div class="card alert"><div class="ch"><span class="ic" style="background:var(--crit)22;color:var(--crit)">🔴</span><h2>Atrasadas — prazo estourado</h2><span class="c" style="color:var(--crit)">'+atr.length+'</span></div>'+
  (atr.length?atr.map(function(t){var od=Math.max(0,Math.floor((NOW-t.dueMs)/DAY));return brow(t,'atrasada há <b>'+od+'d</b>');}).join(""):'<p class="empty">'+(active?'Nenhuma atrasada com esse filtro.':'Nenhuma atrasada 🎉')+'</p>')+'</div>';
 document.getElementById("v-gargalos").innerHTML=bar+atrCard+impCard+waitCard+'<div class="grow">'+wipCard+cliCard+'</div>';
 var gb=document.getElementById("gbadge");var n=allImp.length+allAtr.length;if(n){gb.textContent=n;gb.style.display="";}else gb.style.display="none";}

function renderHist(){var runs=(DATA.runs||[]).slice().reverse();
 var rows=runs.map(function(r){
   var chips="";function c(lbl,v,col){if(v)chips+='<span class="chip hl" style="background:'+col+'">'+lbl+' '+v+'</span>';}
   c("🆕",r.novas,"var(--new)");c("✅",r.concluidas,"var(--good)");c("➡️",r.prodAprov,"var(--warn)");c("⛔",r.novosImped,"var(--crit)");

const num=v=>Number(v)||0;
const midx=k=>{const[y,m]=k.split("-").map(Number);return y*12+(m-1);};
const kfrom=i=>{const y=Math.floor(i/12),m=i%12;return y+"-"+String(m+1).padStart(2,"0");};
const isMK=k=>/^\d{4}-\d{2}$/.test(k);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function monthsShown(cur){const b=midx(cur),a=[];for(let i=0;i<9;i++){const idx=b-i,k=kfrom(idx),m=idx%12;a.push({key:k,lbl:PT[m],yr:String(Math.floor(idx/12)),now:i===0});}return a;}
function fmtDesde(k){if(!k||!isMK(k))return"—";const p=k.split("-");return PT[(+p[1])-1]+"/"+p[0].slice(2);}
function postedTotal(p){return Object.entries(p||{}).reduce((a,[k,v])=>a+num(v),0);}
function olderSum(p,fk){let s=0;const fi=midx(fk);for(const[k,v]of Object.entries(p||{})){if(k==="older")s+=num(v);else if(isMK(k)&&midx(k)<fi)s+=num(v);}return s;}
function statusOf(p,cur){let l=-1;for(const[k,v]of Object.entries(p||{})){if(isMK(k)&&num(v)>0)l=Math.max(l,midx(k));}if(postedTotal(p)===0)return"sem";if(l<0)return"parados";const d=midx(cur)-l;if(d<=1)return"ativos";if(d===2)return"atencao";return"parados";}
const SRANK={sem:0,parados:1,atencao:2,ativos:3};
const LABEL={ativos:"Em dia",atencao:"Atenção",parados:"Parado",sem:"Sem posts"};

let STATE={clientes:[],config:{currentMonth:DEFAULT_MONTH}}, activeEdit=false, ready1=false, ready2=false, pgView="grade", editingId=null;
const cCol=collection(db,"clientes"), cfgRef=doc(db,"config","main");

async function seedIfEmpty(){
  try{
    const snap=await getDocs(cCol);
    if(snap.empty){for(let i=0;i<SEED.length;i++){const c=SEED[i];await setDoc(doc(db,"clientes","c"+i),{nome:c.nome,seg:c.seg,desde:c.desde||"",posts:c.posts,pronto:{},ordem:i});}}
    const cs=await getDoc(cfgRef); if(!cs.exists())await setDoc(cfgRef,{currentMonth:DEFAULT_MONTH});
  }catch(e){setStat("erro de conexão: "+e.code);}
}
function setStat(t){const e=document.getElementById("pgstat");if(e)e.textContent=t;}
onSnapshot(cCol,s=>{STATE.clientes=s.docs.map(d=>({id:d.id,...d.data()}));ready1=true;render();},e=>setStat("erro: "+e.code));
onSnapshot(cfgRef,s=>{STATE.config=s.exists()?s.data():{currentMonth:DEFAULT_MONTH};ready2=true;render();},e=>{});
seedIfEmpty();

async function setStatusOp(id,mes,p,r){setStat("salvando…");try{await updateDoc(doc(db,"clientes",id),{["posts."+mes]:p,["pronto."+mes]:r});setStat("salvo · compartilhado");}catch(e){setStat("erro ao salvar: "+e.code);}}
async function updateCli(id,patch){try{await updateDoc(doc(db,"clientes",id),patch);}catch(e){setStat("erro: "+e.code);}}
async function addCli(){try{await addDoc(cCol,{nome:"Novo cliente",seg:"",desde:"",posts:{},pronto:{},ordem:Date.now()});}catch(e){setStat("erro: "+e.code);}}
async function delCli(id){try{await deleteDoc(doc(db,"clientes",id));}catch(e){setStat("erro: "+e.code);}}
async function setCfg(patch){try{await setDoc(cfgRef,Object.assign({currentMonth:STATE.config.currentMonth||DEFAULT_MONTH},patch),{merge:true});}catch(e){setStat("erro: "+e.code);}}
async function reorderOp(){const cur=STATE.config.currentMonth||DEFAULT_MONTH;const rows=STATE.clientes.map(c=>({c,st:statusOf(c.posts,cur),tot:postedTotal(c.posts)}));rows.sort((a,b)=>SRANK[a.st]-SRANK[b.st]||b.tot-a.tot||String(a.c.nome||"").localeCompare(String(b.c.nome||"")));for(let i=0;i<rows.length;i++){if(rows[i].c.ordem!==i)await updateCli(rows[i].c.id,{ordem:i});}}
async function restoreAll(){setStat("restaurando…");try{const snap=await getDocs(cCol);for(const d of snap.docs)await deleteDoc(doc(db,"clientes",d.id));for(let i=0;i<SEED.length;i++){const c=SEED[i];await setDoc(doc(db,"clientes","c"+i),{nome:c.nome,seg:c.seg,desde:c.desde||"",posts:JSON.parse(JSON.stringify(c.posts)),pronto:{},ordem:i});}await setDoc(cfgRef,{currentMonth:DEFAULT_MONTH});setStat("restaurado");}catch(e){setStat("erro: "+e.code);}}

function slotsHTML(id,mk,p,r,f){let s="";for(let i=0;i<p;i++)s+=`<span class="slot posted" data-id="${id}" data-mes="${mk}" data-st="posted" title="Postado — clique p/ voltar a fazer"></span>`;for(let i=0;i<r;i++)s+=`<span class="slot ready" data-id="${id}" data-mes="${mk}" data-st="ready" title="Pronto — clique p/ marcar postado"></span>`;for(let i=0;i<f;i++)s+=`<span class="slot todo" data-id="${id}" data-mes="${mk}" data-st="todo" title="A fazer — clique p/ marcar pronto"></span>`;return `<div class="slots">${s}</div>`;}

async function addCliData(nome,seg,desde){try{await addDoc(cCol,{nome,seg:seg||"",desde:desde||"",posts:{},pronto:{},ordem:Date.now(),gmn:"add"});setStat("cliente adicionado — pendente de criar no Google");}catch(e){setStat("erro: "+e.code);}}
const gmnState=c=>c.gmn||"ok";
function renderClientes(){
  const host=document.getElementById("pgbody"); if(!host)return;
  const cur=(STATE.config&&STATE.config.currentMonth)||DEFAULT_MONTH;
  const val=id=>{const el=document.getElementById(id);return el?el.value:"";};
  const draft={n:val("ac-nome"),s:val("ac-seg"),d:val("ac-desde")};
  const edActive=editingId&&document.getElementById("ed-nome");
  const ed=edActive?{n:val("ed-nome"),s:val("ed-seg"),d:val("ed-desde")}:null;
  const rows=STATE.clientes.slice().sort((a,b)=>((a.ordem==null?1e9:a.ordem)-(b.ordem==null?1e9:b.ordem))||String(a.nome||"").localeCompare(String(b.nome||"")));
  const toAdd=rows.filter(c=>gmnState(c)==="add"), toRemove=rows.filter(c=>gmnState(c)==="remove");
  let h=`<p class="pgsub">Adicione, edite ou dê saída em clientes. Quando um entra ou sai, fica uma <b>pendência aqui pro gestor do Google Meu Negócio</b> criar/remover o perfil lá também — nada some sem passar por essa lista.</p>`;
  if(toAdd.length||toRemove.length){
    h+=`<div class="pendbox"><div class="pendtitle">⚠️ Pendências no Google Empresas — o gestor precisa fazer lá:</div>`;
    if(toAdd.length)h+=`<div class="pendrow"><span class="ptag add">➕ criar no Google</span> ${toAdd.map(c=>esc(c.nome)).join(" · ")}</div>`;
    if(toRemove.length)h+=`<div class="pendrow"><span class="ptag rem">➖ remover do Google</span> ${toRemove.map(c=>esc(c.nome)).join(" · ")}</div>`;
    h+=`<div class="pendhint">Depois de fazer no Gerenciador do Google, clique em “✓ Feito no Google” na linha do cliente pra dar baixa.</div></div>`;
  }
  h+=`<div class="pgcard addcard"><div class="addtitle">+ Adicionar cliente</div><div class="addgrid">
    <input class="ei2" id="ac-nome" placeholder="Nome do cliente" value="${esc(draft.n)}">
    <input class="ei2" id="ac-seg" placeholder="Segmento · Cidade (ex.: Moda · Vitória)" value="${esc(draft.s)}">
    <input class="ei2" id="ac-desde" type="month" title="Mês de entrada" value="${esc(draft.d)}">
    <button class="pgb primary" data-act="addcli">Adicionar</button></div></div>`;
  h+=`<div class="pgcard"><div class="pgscroll"><table class="pg clitab"><thead><tr>
    <th class="ch" style="text-align:left;padding-left:14px">Cliente</th><th class="ch" style="text-align:left">Segmento</th><th class="ch">Entrada</th><th class="ch">Posts</th><th class="ch">Status</th><th class="ch">Ações</th></tr></thead><tbody>`;
  rows.forEach(c=>{const st=statusOf(c.posts,cur),tot=postedTotal(c.posts),g=gmnState(c);
    if(editingId===c.id){
      h+=`<tr data-id="${c.id}" class="editing"><td class="cl-n"><input class="ei2 sm2" id="ed-nome" value="${esc(ed?ed.n:(c.nome||''))}"></td>
        <td class="cl-s"><input class="ei2 sm2" id="ed-seg" value="${esc(ed?ed.s:(c.seg||''))}"></td>
        <td><input class="ei2 sm2" id="ed-desde" type="month" value="${esc(ed?ed.d:(c.desde||''))}"></td>
        <td class="mono2">${tot}</td><td></td>
        <td style="text-align:center;white-space:nowrap"><button class="pgb ok" data-act="savecli" data-id="${c.id}">Salvar</button> <button class="pgb" data-act="canceledit">Cancelar</button></td></tr>`;
    }else{
      const badge=g==="add"?`<span class="gbadge add">a criar no Google</span>`:g==="remove"?`<span class="gbadge rem">a remover do Google</span>`:'';
      const acts=(g==="ok")
        ?`<button class="pgb" data-act="editcli" data-id="${c.id}">✎ Editar</button> <button class="pgb danger" data-act="markremove" data-id="${c.id}">Saída</button>`
        :`<button class="pgb ok" data-act="donesync" data-id="${c.id}">✓ Feito no Google</button> <button class="pgb" data-act="cancelsync" data-id="${c.id}">Desfazer</button>`;
      h+=`<tr data-id="${c.id}" class="${g!=='ok'?'pend':''}"><td class="cl-n"><span class="cdot ${st}"></span><b>${esc(c.nome)}</b> ${badge}</td>
        <td class="cl-s">${esc(c.seg||"—")}</td><td class="mono2">${fmtDesde(c.desde)}</td><td class="mono2">${tot}</td>
        <td style="text-align:center"><span class="pill ${st}">${LABEL[st]}</span></td>
        <td style="text-align:center;white-space:nowrap">${acts}</td></tr>`;
    }});
  h+=`</tbody></table></div></div><div class="pgstat">${STATE.clientes.length} clientes · ${toAdd.length} a criar · ${toRemove.length} a remover no Google</div>`;
  host.innerHTML=h;
}
function render(){
  const outer=document.getElementById("v-posts"); if(!outer)return; if(activeEdit)return;
  outer.innerHTML=`<div class="pgnav2"><button class="pgtab2 ${pgView==='grade'?'on':''}" data-view="grade">📊 Grade de postagens</button><button class="pgtab2 ${pgView==='clientes'?'on':''}" data-view="clientes">👥 Gerir clientes</button></div><div id="pgbody"></div>`;
  if(pgView==='clientes')return renderClientes();
  const host=document.getElementById("pgbody"); if(!host)return;
  const cur=(STATE.config&&STATE.config.currentMonth)||DEFAULT_MONTH;
  const months=monthsShown(cur), firstKey=months[months.length-1].key;
  const rows=STATE.clientes.map(c=>({c,st:statusOf(c.posts,cur),tot:postedTotal(c.posts)}));
  rows.sort((a,b)=>((a.c.ordem==null?1e9:a.c.ordem)-(b.c.ordem==null?1e9:b.c.ordem))||String(a.c.nome||"").localeCompare(String(b.c.nome||"")));
  let kp=0,kr=0,kf=0,stock=0;
  STATE.clientes.forEach(c=>{kp+=num((c.posts||{})[cur]);kr+=num((c.pronto||{})[cur]);kf+=Math.max(0,META-num((c.posts||{})[cur])-num((c.pronto||{})[cur]));Object.keys(c.pronto||{}).forEach(k=>{if(isMK(k))stock+=num(c.pronto[k]);});});
  const cm=months[0].lbl+"/"+months[0].yr.slice(2);
  let h=`<p class="pgsub"><b>Controle de postagens do Google.</b> Cada mês tem 4 vagas (meta 4/mês). <b>Clique numa vaga</b> para alternar: a fazer → pronto → postado. Salva sozinho e sincroniza pra equipe.</p>`;
  h+=`<div class="pgkpis">
    <div class="pgkpi k-posted"><span class="st"></span><div class="n">${kp}</div><div class="l">🟩 Postados em ${cm}</div></div>
    <div class="pgkpi k-ready"><span class="st"></span><div class="n">${kr}</div><div class="l">🟧 Prontos p/ postar em ${cm}</div></div>
    <div class="pgkpi k-todo"><span class="st"></span><div class="n">${kf}</div><div class="l">⬜ A fazer em ${cm}</div></div>
    <div class="pgkpi k-ready"><span class="st"></span><div class="n">${stock}</div><div class="l">🟧 Estoque pronto (todos os meses)</div></div></div>`;
  h+=`<div class="pgtb"><button class="pgb primary" data-act="add">+ Cliente</button><button class="pgb" data-act="reorder">↕ Reordenar</button>
    <div class="pgnav"><button data-act="prev">◀</button><span class="lbl">${months[8].lbl}/${months[8].yr.slice(2)} – ${months[0].lbl}/${months[0].yr.slice(2)}</span><button data-act="next">▶</button></div>
    <div class="sp"></div><button class="pgb" data-act="restore">⟲ Restaurar Google</button><button class="pgb" data-act="csv">Exportar CSV</button></div>`;
  h+=`<div class="pglg"><span class="it"><span class="lg posted"></span> Postado</span><span class="it"><span class="lg ready"></span> Pronto (falta postar)</span><span class="it"><span class="lg todo"></span> A fazer</span><span class="pghint">clique numa vaga para alternar · hachurado = antes do contrato</span></div>`;
  h+=`<div class="pgcard"><div class="pgscroll"><table class="pg"><thead><tr><th class="cn ch" style="text-align:left">Cliente</th>`;
  months.forEach(m=>{h+=`<th class="ch${m.now?' now':''}">${m.lbl}<small>${m.yr}</small></th>`;});
  h+=`<th class="ch">2025−<small>e antes</small></th><th class="ch">Desde<small>cliente</small></th><th class="ch">Post.<small>total</small></th><th class="ch" style="text-align:right;padding-right:12px">Status</th></tr></thead><tbody>`;
  rows.forEach(({c,st,tot})=>{
    const pre=c.desde&&isMK(c.desde)?c.desde:null;
    h+=`<tr data-id="${c.id}"><td class="cn"><div class="crow"><span class="cdot ${st}"></span><div class="cbody"><div class="cnm" data-edit="nome">${esc(c.nome)}</div><div class="csg" data-edit="seg">${esc(c.seg||"")}</div></div><button class="del" title="Remover">✕</button></div></td>`;
    months.forEach(m=>{const before=pre&&m.key<pre;if(before){h+=`<td class="cell na${m.now?' now':''}"><span class="naem">·</span></td>`;return;}const p=num((c.posts||{})[m.key]),r=num((c.pronto||{})[m.key]),tt=Math.max(META,p+r),f=Math.max(0,tt-p-r);h+=`<td class="cell${m.now?' now':''}">${slotsHTML(c.id,m.key,p,r,f)}</td>`;});
    const ob=olderSum(c.posts,firstKey);
    h+=`<td class="cell"><div class="slots">${ob>0?`<span style="font-family:'IBM Plex Mono';font-size:12px;color:var(--ink2)">${ob}</span>`:'<span class="naem">·</span>'}</div></td>`;
    h+=`<td class="desde${pre?'':' none'}">${fmtDesde(c.desde)}</td><td class="tot">${tot}</td><td class="pc"><span class="pill ${st}">${LABEL[st]}</span></td></tr>`;
  });
  const sums=months.map(m=>{let p=0,r=0;STATE.clientes.forEach(c=>{const pre=c.desde&&isMK(c.desde)?c.desde:null;if(pre&&m.key<pre)return;p+=num((c.posts||{})[m.key]);r+=num((c.pronto||{})[m.key]);});return{p,r};});
  h+=`<tr class="sr"><td class="cn">Total</td>`;sums.forEach((s,i)=>{h+=`<td class="${months[i].now?'now':''}"><div class="sm"><b class="g">${s.p}</b>${s.r?`<b class="o">+${s.r}</b>`:''}</div></td>`;});h+=`<td></td><td></td><td></td><td></td></tr>`;
  h+=`</tbody></table></div></div><div class="pgstat" id="pgstat">${(ready1&&ready2)?'salvo · compartilhado':'conectando…'}</div>`;
  host.innerHTML=h;
}

function startEdit(el){
  if(activeEdit)return;activeEdit=true;
  const id=el.closest("tr").dataset.id,field=el.dataset.edit;
  const c=STATE.clientes.find(x=>x.id===id);const val=c?(c[field]||""):"";
  el.innerHTML=`<input class="ei" value="${esc(val)}">`;const inp=el.querySelector("input");inp.focus();inp.select();
  let done=false;const fin=async(commit)=>{if(done)return;done=true;activeEdit=false;if(commit&&inp.value!==val)await updateCli(id,{[field]:inp.value});render();};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();fin(true);}else if(e.key==="Escape")fin(false);});
  inp.addEventListener("blur",()=>fin(true));
}
function exportCSV(){
  const cur=STATE.config.currentMonth||DEFAULT_MONTH;const months=monthsShown(cur).slice().reverse();
  const rows=STATE.clientes.map(c=>({c,st:statusOf(c.posts,cur)})).sort((a,b)=>((a.c.ordem==null?1e9:a.c.ordem)-(b.c.ordem==null?1e9:b.c.ordem)));
  const head=["Cliente","Segmento","Cliente desde",...months.map(m=>m.lbl+"/"+m.yr.slice(2)+" (post/pronto/afazer)"),"Postados "+monthsShown(cur)[0].lbl,"Prontos "+monthsShown(cur)[0].lbl,"A fazer "+monthsShown(cur)[0].lbl,"Estoque pronto","Status"];
  const lines=[head.join(",")];
  rows.forEach(({c,st})=>{const pre=c.desde&&isMK(c.desde)?c.desde:null;const cells=months.map(m=>{if(pre&&m.key<pre)return '"—"';const p=num((c.posts||{})[m.key]),r=num((c.pronto||{})[m.key]),f=Math.max(0,META-p-r);return `"${p}/${r}/${f}"`;});const cp=num((c.posts||{})[cur]),cr=num((c.pronto||{})[cur]),cf=Math.max(0,META-cp-cr);let stk=0;Object.keys(c.pronto||{}).forEach(k=>{if(isMK(k))stk+=num(c.pronto[k]);});lines.push([`"${(c.nome||'').replace(/"/g,'""')}"`,`"${(c.seg||'').replace(/"/g,'""')}"`,`"${fmtDesde(c.desde)}"`,...cells,cp,cr,cf,stk,LABEL[st]].join(","));});
  const csv="﻿"+lines.join("\r\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ronda-postagens.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

document.getElementById("v-posts").addEventListener("click",async e=>{
  const nav=e.target.closest("[data-view]");if(nav){pgView=nav.dataset.view;render();return;}
  const slot=e.target.closest(".slot");
  if(slot){const id=slot.dataset.id,mes=slot.dataset.mes,stt=slot.dataset.st;const c=STATE.clientes.find(x=>x.id===id);if(!c)return;let p=num((c.posts||{})[mes]),r=num((c.pronto||{})[mes]);if(stt==="todo")r++;else if(stt==="ready"){r--;p++;}else if(stt==="posted")p--;p=Math.max(0,p);r=Math.max(0,r);await setStatusOp(id,mes,p,r);return;}
  const del=e.target.closest(".del");if(del){const tr=del.closest("tr");if(confirm('Remover "'+tr.querySelector(".cnm").textContent+'" do painel?'))delCli(tr.dataset.id);return;}
  const te=e.target.closest("[data-edit]");if(te){startEdit(te);return;}
  const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;
  if(act==="add")addCli();
  else if(act==="addcli"){const nm=(document.getElementById("ac-nome").value||"").trim();if(!nm){alert("Digite o nome do cliente.");return;}addCliData(nm,(document.getElementById("ac-seg").value||"").trim(),(document.getElementById("ac-desde").value||"").trim());}
  else if(act==="editcli"){editingId=b.dataset.id;render();}
  else if(act==="canceledit"){editingId=null;render();}
  else if(act==="savecli"){const id=b.dataset.id;const nm=(document.getElementById("ed-nome").value||"").trim();if(!nm){alert("O nome não pode ficar vazio.");return;}await updateCli(id,{nome:nm,seg:(document.getElementById("ed-seg").value||"").trim(),desde:(document.getElementById("ed-desde").value||"").trim()});editingId=null;render();}
  else if(act==="markremove"){const id=b.dataset.id;const c=STATE.clientes.find(x=>x.id===id);if(confirm('Marcar "'+(c?c.nome:'')+'" como SAÍDA?\n\nEle NÃO some ainda — vira uma pendência pro gestor remover do Google. Depois de remover lá, dá baixa.'))updateCli(id,{gmn:"remove"});}
  else if(act==="donesync"){const id=b.dataset.id;const c=STATE.clientes.find(x=>x.id===id);const g=c?(c.gmn||"ok"):"ok";if(g==="remove"){if(confirm('Confirmar que "'+c.nome+'" já foi removido do Google?\n\nIsso tira ele do painel de vez.'))delCli(id);}else{updateCli(id,{gmn:"ok"});}}
  else if(act==="cancelsync"){updateCli(b.dataset.id,{gmn:"ok"});}
  else if(act==="reorder")reorderOp();
  else if(act==="prev")setCfg({currentMonth:kfrom(midx(STATE.config.currentMonth||DEFAULT_MONTH)-1)});
  else if(act==="next")setCfg({currentMonth:kfrom(midx(STATE.config.currentMonth||DEFAULT_MONTH)+1)});
  else if(act==="restore"){if(confirm("Restaurar TODOS os dados como foram puxados do Google? Isso apaga as marcações de pronto/a fazer e edições."))restoreAll();}
  else if(act==="csv")exportCSV();
});
</script>
